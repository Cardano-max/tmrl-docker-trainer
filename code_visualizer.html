 "classification": "Unclassified", "badge": null, "children": [{"name": "def main() \u2192 Any", "details": "Main entry point", "classification": "Unclassified"}, {"name": "logger: Any", "details": "Global variable", "classification": "Unclassified"}, {"name": "class MPCIntegratedTrainer", "badge": "Knowledge", "details": "Extended TMRL Trainer with MPC-RL Integration\nDirectly logs to knowledge graph during training", "children": [{"name": "def __init__() \u2192 Any", "details": "Initialize with MPC components", "classification": "Unclassified"}, {"name": "def extract_state_from_obs(obs: Any) \u2192 Any", "details": "Extract state from observation", "classification": "Brain Capacity"}, {"name": "def extract_action_from_array(action_arr: Any) \u2192 Any", "details": "Extract action dict", "classification": "Unclassified"}, {"name": "def process_memory_batch() \u2192 Any", "details": "Process new transitions from memory", "classification": "Brain Capacity"}, {"name": "def log_mpc_statistics() \u2192 Any", "details": "Log MPC system statistics", "classification": "Unclassified"}, {"name": "def train(batch: Any) \u2192 Any", "details": "Override train to process memory before each training step", "classification": "Brain Capacity"}]}]}]};

        const margin = {top: 50, right: 400, bottom: 50, left: 180};
        const width = window.innerWidth - margin.left - margin.right;
        const height = window.innerHeight - margin.top - margin.bottom - 220;

        const root = d3.hierarchy(data);
        root.x0 = height / 2;
        root.y0 = 0;

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const treeLayout = d3.tree()
            .size([height, width]);

        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform));

        svg.call(zoom);

        let i = 0;
        const duration = 750;

        function update(source) {
            const treeData = treeLayout(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            // Horizontal: deeper = further right
            nodes.forEach(d => d.y = d.depth * 300);

            const node = g.selectAll(".node")
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on("click", clicked);

            nodeEnter.append("circle")
                .attr("r", 10)
                .style("fill", d => {
                    if (d.data.classification) {
                        if (d.data.classification.includes("Capacity")) return "#764ba2";
                        if (d.data.classification.includes("Knowledge")) return "#f5576c";
                        if (d.data.classification.includes("Intelligence")) return "#00f2fe";
                    }
                    return d.children ? "#667eea" : "#43e97b";
                })
                .style("stroke", "#fff")
                .style("stroke-width", "2px");

            nodeEnter.append("text")
                .attr("dy", "0.35em")
                .attr("x", d => d.children ? -20 : 20)
                .attr("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name)
                .style("font-weight", "600");

            // Badge
            nodeEnter.filter(d => d.data.badge)
                .append("text")
                .attr("dy", "0.35em")
                .attr("x", d => d.children ? -20 - (d.data.name.length * 8) - 20 : 20)
                .attr("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.badge)
                .attr("class", d => "badge badge-" + d.data.badge.toLowerCase().replace(/ /g, "-"));

            const nodeUpdate = nodeEnter.merge(node)
                .transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            const nodeExit = node.exit()
                .transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select("circle").attr("r", 1e-6);
            nodeExit.selectAll("text").style("fill-opacity", 1e-6);

            const link = g.selectAll(".link")
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            linkEnter.merge(link)
                .transition()
                .duration(duration)
                .attr("d", diagonal);

            link.exit().transition().duration(duration).remove();

            nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
        }

        function diagonal(s, d) {
            return `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`;
        }

        function clicked(event, d) {
            if (d.children) {
                d._children = d.children;

            update(d);

            let badgeHTML = "";
            if (d.data.badge) {
                badgeHTML = `<span class="badge badge-${d.data.badge.toLowerCase().replace(/ /g, "-")}">${d.data.badge}</span><br><br>`;
            }

            const detailsHTML = `
                <h3>${d.data.name}</h3>
                ${badgeHTML}
                <pre>${d.data.details || "No additional details available."}</pre>
            `;
            d3.select("#details").html(detailsHTML);
        }

        update(root);

        // Auto-fit zoom to show entire tree on load
        const bounds = g.node().getBBox();
        const fullWidth = bounds.width + margin.left + margin.right;
        const fullHeight = bounds.height + margin.top + margin.bottom;
        const scale = Math.min(
            (window.innerWidth * 0.95) / fullWidth,
            (window.innerHeight * 0.85) / fullHeight
        );
        const translate = [
            (window.innerWidth - fullWidth * scale) / 2,
            (window.innerHeight - fullHeight * scale) / 2 + 50
        ];
        svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(...translate).scale(scale));

        // Search
        d3.select("#search").on("input", function() {
            const term = this.value.toLowerCase();
            g.selectAll(".node text")
                .style("font-weight", d => (d.data.name + " " + (d.data.details || "")).toLowerCase().includes(term) ? "900" : "500")
                .style("fill", d => (d.data.name + " " + (d.data.details || "")).toLowerCase().includes(term) ? "#ffd700" : "white");
        });

        // Filter
        d3.selectAll(".filter-btn").on("click", function() {
            d3.selectAll(".filter-btn").classed("active", false);
            d3.select(this).classed("active", true);
            const filter = this.getAttribute("data-filter");

            g.selectAll(".node circle, .node text")
                .style("opacity", d => {
                    if (filter === "all") return 1;
                    if (!d.data.classification) return 0.3;
                    return d.data.classification === filter ? 1 : 0.3;
                });
        });
    </script>
</body>
</html>
