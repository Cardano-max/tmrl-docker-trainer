version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    networks:
      - tmrl-network
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tmrl-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tmrl_server
    ports:
      - "6666:6666"
      - "6667:6667"
    networks:
      - tmrl-network
    depends_on:
      falkordb:
        condition: service_healthy

  tmrl-trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: tmrl_trainer
    networks:
      - tmrl-network
    depends_on:
      - tmrl-server
      - falkordb
    volumes:
      - ./checkpoints:/root/TmrlData/checkpoints
      - ./weights:/root/TmrlData/weights
    command: python3 train_with_mpc_direct.py

  mpc-processor:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: mpc_processor
    networks:
      - tmrl-network
    depends_on:
      - falkordb
    volumes:
      - ./checkpoints:/root/TmrlData/checkpoints:ro
      - ./weights:/root/TmrlData/weights:ro
    command: tail -f /dev/null

networks:
  tmrl-network:
    driver: bridge

volumes:
  falkordb_data: